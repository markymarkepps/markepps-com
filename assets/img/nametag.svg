<svg xmlns="http://www.w3.org/2000/svg" width="390" height="230" viewBox="0 0 390 230" role="img" aria-label="Hello, my name is Mark Epps">
  <title>Hello, my name is Mark Epps</title>
  <defs>
    <style>
      @font-face {
        font-family: "Permanent Marker";
        font-style: normal;
        font-weight: 400;
        src: url("data:font/woff2;base64,") format("woff2");
      }
      .shadow  { fill: rgba(0,0,0,0.20); }
      .card    { fill: #ffffff; }
      .top     { fill: #1976d2; }
      .hello   { font: 900 52px "Arial Black", Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: auto; }
      .nameis  { font: 700 22px Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: auto; }
      .name    { font: 400 54px "Permanent Marker", cursive; fill: #111111; text-anchor: middle; dominant-baseline: auto; }
      @media (prefers-color-scheme: dark) {
        .top { fill: #d32f2f; }
      }
    </style>
  </defs>

  <!-- Offset hard shadow (10px right, 10px down, no blur) -->
  <rect x="10" y="10" width="370" height="215" rx="15" class="shadow"/>

  <!-- Card background (always white) -->
  <rect x="0" y="0" width="370" height="215" rx="15" class="card"/>

  <!-- Coloured top band, rounded at top only -->
  <rect x="0" y="0" width="370" height="125" rx="15" class="top"/>
  <!-- Square off the bottom of the coloured band -->
  <rect x="0" y="110" width="370" height="15" class="top"/>

  <!-- HELLO -->
  <text x="185" y="72" class="hello">HELLO</text>

  <!-- my name is -->
  <text x="185" y="106" class="nameis">my name is</text>

  <!-- Mark Epps -->
  <text x="185" y="180" class="name">Mark Epps</text>
</svg>
